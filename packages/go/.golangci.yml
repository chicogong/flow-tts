version: "2"
run:
  timeout: 5m
  go: "1.20"
linters:
  enable:
    - gocritic
    - misspell
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    gocritic:
      disabled-checks:
        - appendAssign
      enabled-tags:
        - diagnostic
        - style
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/chicogong/flow-tts
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
